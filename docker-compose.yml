# Local synthetic sandbox only. SQLite/local originals are intentional.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FREIGHT_DATA_DIR: /data
    volumes:
      - freight_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  ui:
    build: .
    command: ["streamlit", "run", "ui.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      FREIGHT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  freight_data:
